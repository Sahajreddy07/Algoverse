<svg viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20" />
      <stop offset="50%" stop-color="#181333" />
      <stop offset="100%" stop-color="#0B0917" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="purpleGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradients -->
    <radialGradient id="badgeGrad" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAF9FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Badge Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="280" rx="20" fill="url(#bgGrad)" />
  <rect width="900" height="280" rx="20" fill="url(#purpleGlow)" />
  <rect width="900" height="280" rx="20" fill="url(#pinkGlow)" />
  <rect width="898" height="278" x="1" y="1" rx="19" stroke="rgba(196, 181, 253, 0.2)" stroke-width="1.5" />

  <!-- Geometric Constellation Grid Lines in Background -->
  <g stroke="rgba(167, 139, 250, 0.12)" stroke-width="1">
    <line x1="120" y1="40" x2="320" y2="90" />
    <line x1="320" y1="90" x2="520" y2="40" />
    <line x1="520" y1="40" x2="720" y2="110" />
    <line x1="720" y1="110" x2="840" y2="60" />
    <line x1="320" y1="90" x2="420" y2="210" />
    <line x1="420" y1="210" x2="680" y2="230" />
    <line x1="680" y1="230" x2="720" y2="110" />
  </g>

  <!-- Tiny Constellation Sparkles -->
  <circle cx="120" cy="40" r="2.5" fill="#C4B5FD" opacity="0.6" />
  <circle cx="320" cy="90" r="3" fill="#A855F7" opacity="0.7" />
  <circle cx="520" cy="40" r="2" fill="#EC4899" opacity="0.5" />
  <circle cx="720" cy="110" r="3" fill="#C4B5FD" opacity="0.8" />
  <circle cx="840" cy="60" r="2.5" fill="#A855F7" opacity="0.6" />
  <circle cx="420" cy="210" r="3" fill="#7C3AED" opacity="0.7" />
  <circle cx="680" cy="230" r="2" fill="#EC4899" opacity="0.6" />

  <!-- 3D Brand Logo Badge on Left -->
  <g transform="translate(70, 60)" filter="url(#shadow)">
    <!-- Base Circular Badge -->
    <circle cx="80" cy="80" r="72" fill="url(#badgeGrad)" stroke="#C4B5FD" stroke-width="2.5" />
    <circle cx="80" cy="80" r="66" stroke="rgba(124, 58, 237, 0.15)" stroke-width="1.5" />

    <!-- Traversal Lines forming subtle 'A' -->
    <line x1="80" y1="36" x2="48" y2="116" stroke="url(#lineGrad)" stroke-width="5.5" stroke-linecap="round" />
    <line x1="80" y1="36" x2="112" y2="116" stroke="url(#lineGrad)" stroke-width="5.5" stroke-linecap="round" />
    <line x1="60" y1="82" x2="100" y2="82" stroke="url(#lineGrad)" stroke-width="5.5" stroke-linecap="round" />

    <!-- Traversal Nodes -->
    <circle cx="80" cy="36" r="10.5" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="60" cy="82" r="8.5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3.5" />
    <circle cx="100" cy="82" r="8.5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3.5" />
    <circle cx="48" cy="116" r="9.5" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="3.5" />
    <circle cx="112" cy="116" r="9.5" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="3.5" />
    <circle cx="80" cy="82" r="5.5" fill="#EC4899" />
  </g>

  <!-- Typography on Right (Vertically Centered & Clean, No Bottom Tags) -->
  <g transform="translate(265, 0)">
    <!-- Main Wordmark -->
    <text x="0" y="128" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
      AlgoVerse<tspan fill="#A855F7">.</tspan>
    </text>

    <!-- Tagline Subtitle -->
    <text x="0" y="172" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600" fill="#C4B5FD" letter-spacing="-0.2">
      Interactive 3D Algorithm Visualizer &amp; Sensory Learning Environment
    </text>

    <!-- Secondary Line -->
    <text x="0" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
      Explore sorting, binary search &amp; graph networks through spatial depth and Web Audio.
    </text>
  </g>
</svg>
