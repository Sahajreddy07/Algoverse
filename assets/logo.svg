<svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="badgeGrad" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAF9FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </radialGradient>
    <linearGradient id="lineGrad" x1="12" y1="12" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 3D Beveled Circular Badge -->
  <circle cx="28" cy="28" r="25" fill="url(#badgeGrad)" stroke="#C4B5FD" stroke-width="1.2" filter="url(#badgeShadow)" />
  <circle cx="28" cy="28" r="23" stroke="rgba(124, 58, 237, 0.12)" stroke-width="0.8" />

  <!-- Interconnected Traversal Lines subtly forming an 'A' -->
  <line x1="28" y1="12" x2="17" y2="40" stroke="url(#lineGrad)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="28" y1="12" x2="39" y2="40" stroke="url(#lineGrad)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="21" y1="28" x2="35" y2="28" stroke="url(#lineGrad)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Geometric Interlocking Nodes -->
  <circle cx="28" cy="12" r="4.2" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="21" cy="28" r="3.4" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="35" cy="28" r="3.4" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="17" cy="40" r="3.8" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="39" cy="40" r="3.8" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="28" cy="28" r="2.2" fill="#EC4899" />
</svg>
